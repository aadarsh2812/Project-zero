spring.application.name=ProjectZero
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hoteldb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# App config
app.redis.kitchen-channel-prefix=hotel_kitchen_
app.session.ttl=28800
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://10.0.2.24:3000,http://10.0.2.24:3001,http://10.0.2.24:3002

logging.level.com.Project.ProjectZero=INFO
