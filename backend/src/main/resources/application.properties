server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hoteldb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Redis Pub/Sub channel prefix
app.redis.kitchen-channel-prefix=hotel_kitchen_

# Session TTL in seconds (8 hours)
app.session.ttl=28800

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002

logging.level.com.hotel=INFO
