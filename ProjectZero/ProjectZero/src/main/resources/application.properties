spring.application.name=ProjectZero
server.port=8080

# H2 In-Memory Database (dev profile)
spring.datasource.url=jdbc:h2:file:./data/hoteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.session.ttl=28800
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002

logging.level.com.Project.ProjectZero=INFO

